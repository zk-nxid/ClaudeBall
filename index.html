<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Arcade</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A personal arcade of browser games that work offline: Touge Drift and Claude Ball.">
  <meta name="theme-color" content="#0a0b0e">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/icons/arcade.svg">
  <link rel="apple-touch-icon" href="assets/icons/arcade-180.png">
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="bar">
    <a class="brand" href="#/" aria-label="Arcade home">
      <img src="assets/icons/arcade.svg" alt="" width="30" height="30">
      <span>ARCADE</span>
    </a>
    <nav aria-label="Main">
      <a href="#/" data-nav="home">Library</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="foot">
    <span id="foot-mode"></span>
    <span>Everything runs in your browser. No accounts, no tracking.</span>
  </footer>

  <dialog id="dlg"><form method="dialog"><h3 id="dlg-title"></h3><p id="dlg-text"></p><div class="dlg-actions"><button class="btn ghost" value="cancel" id="dlg-cancel">Cancel</button><button class="btn solid" value="ok" id="dlg-ok">OK</button></div></form></dialog>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="registry.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
